        background: rgba(15, 23, 42, 0.55);
        color: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;

      .cf-gallery-check-on {
        background: #2563eb;
        border-color: #ffffff;

      .cf-gallery-caption {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 3px 6px;
        font-size: 10px;
        font-weight: 500;
        color: #ffffff;
        background: linear-gradient(
          to top,
          rgba(2, 6, 23, 0.85),
          rgba(2, 6, 23, 0)
        );
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        text-align: left;
      }
      .cf-video-badge {
        position: absolute;
        left: 4px;
        top: 4px;
        padding: 2px 4px;
        border-radius: 4px;
        background: rgba(15, 23, 42, 0.78);
        color: #ffffff;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .cf-import-pill {
        position: absolute;
        top: 10px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 25;
        padding: 5px 12px;
        border-radius: 999px;
        background: rgba(15, 23, 42, 0.88);
        color: #ffffff;
        font-size: 11px;
        font-weight: 600;
        white-space: nowrap;
        pointer-events: none;
      }
      .cf-media-fallback-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        padding: 18px 22px;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.94);
        border: 1px solid #cbd5e1;
      }
      .dark .cf-media-fallback-card {
        background: rgba(15, 23, 42, 0.94);
        border-color: #334155;
      }
      .cf-desktop-modal {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: min(680px, 92vw);
        height: min(560px, 82vh);
        z-index: 45;
        border-radius: 16px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        box-shadow: 0 24px 60px rgba(2, 6, 23, 0.32);
      }
      .cf-split-slider-dock {
        position: absolute;
        left: 50%;
        bottom: 10px;
        transform: translateX(-50%);
        z-index: 25;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 6px 12px;
        border-radius: 999px;
        background: rgba(15, 23, 42, 0.86);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.16);
        box-shadow: 0 10px 28px rgba(2, 6, 23, 0.36);
        max-width: min(360px, calc(100% - 24px));
      }
      .cf-split-slider-tag {
        font-size: 10px;
        font-weight: 600;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #f8fafc;
        white-space: nowrap;
        user-select: none;
      }
      .cf-split-slider-range {
        width: 150px;
        accent-color: #3b82f6;
      }
      .cf-bulk-modal-backdrop {
        position: fixed;
        inset: 0;
        z-index: 90;
        background: rgba(2, 6, 23, 0.72);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
      }
      .cf-bulk-modal-card {
        width: min(440px, 94vw);
        border-radius: 16px;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        box-shadow: 0 24px 64px rgba(2, 6, 23, 0.45);
      }
      .cf-bulk-progress-track {
        width: 100%;
        height: 8px;
        border-radius: 999px;
        background: rgba(148, 163, 184, 0.25);
        overflow: hidden;
      }
      .cf-bulk-progress-fill {
        height: 100%;
        border-radius: 999px;
        background: linear-gradient(90deg, #2563eb, #38bdf8);
        transition: width 180ms ease;
      }
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: 0 0;
      }
      ::-webkit-scrollbar-thumb {
        background: #64748b47;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #64748b7a;
